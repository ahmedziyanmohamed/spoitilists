name: Verify Mornye extension package

on:
  push:
    branches: [main, master]
    paths:
      - "sources/**"
      - "tests/**"
      - "scripts/build_packages.py"
      - "registry.json"
      - ".github/workflows/verify-extension-package.yml"
  pull_request:
    paths:
      - "sources/**"
      - "tests/**"
      - "scripts/build_packages.py"
      - "registry.json"
      - ".github/workflows/verify-extension-package.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          if ls tests/*.test.cjs >/dev/null 2>&1; then
            node --test tests/*.test.cjs
          else
            echo "No Node test files found; skipping test step."
          fi

      - name: Validate manifest and registry consistency
        shell: bash
        run: |
          set -euo pipefail

          SRC_MANIFEST="sources/spoiti-lists/manifest.json"
          REGISTRY="registry.json"

          if [[ ! -f "$SRC_MANIFEST" ]]; then
            echo "::error title=Missing Manifest::${SRC_MANIFEST} does not exist."
            exit 1
          fi

          if [[ ! -f "$REGISTRY" ]]; then
            echo "::error title=Missing Registry::${REGISTRY} does not exist."
            exit 1
          fi

          SRC_VERSION="$(jq -r '.version' "$SRC_MANIFEST")"
          REG_VERSION="$(jq -r '.extensions[] | select(.id == "spoiti-lists") | .version' "$REGISTRY")"

          if [[ -z "$REG_VERSION" || "$REG_VERSION" == "null" ]]; then
            echo "::error title=Registry Missing Entry::${REGISTRY} does not contain a spoiti-lists entry."
            exit 1
          fi

          if [[ "$SRC_VERSION" != "$REG_VERSION" ]]; then
            echo "::error title=Version Mismatch::${SRC_MANIFEST} version (${SRC_VERSION}) does not match ${REGISTRY} (${REG_VERSION})."
            exit 1
          fi

          SRC_AUTHOR="$(jq -r '.author' "$SRC_MANIFEST")"
          if [[ "$SRC_AUTHOR" != "Ziyan" ]]; then
            echo "::error title=Author Mismatch::Expected author 'Ziyan' in ${SRC_MANIFEST}, found '${SRC_AUTHOR}'."
            exit 1
          fi

          echo "OK: manifest and registry are aligned for version ${SRC_VERSION}"

      - name: Verify generated package output matches committed files
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          cp -R . "$tmp_dir/repo"
          cd "$tmp_dir/repo"
          python3 scripts/build_packages.py

          cd "$GITHUB_WORKSPACE"

          if ! cmp -s registry.json "$tmp_dir/repo/registry.json"; then
            echo "::error title=Registry Drift::registry.json is out of date. Run scripts/build_packages.py and commit the generated output."
            diff -u registry.json "$tmp_dir/repo/registry.json" || true
            exit 1
          fi

          while IFS= read -r -d '' file; do
            rel_path="${file#$GITHUB_WORKSPACE/}"
            generated_path="$tmp_dir/repo/$rel_path"

            if [[ -f "$generated_path" ]] && ! cmp -s "$file" "$generated_path"; then
              echo "::error title=Generated Output Drift::${rel_path} differs from the generated output."
              diff -u "$file" "$generated_path" || true
              exit 1
            fi
          done < <(find extensions -type f -print0)

          echo "OK: generated package output matches the committed repository state"
