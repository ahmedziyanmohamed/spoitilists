name: Verify Mornye extension source and package

on:
  push:
    branches: [main, master]
    paths:
      - "sources/**"
      - "tests/**"
      - "scripts/build_packages.py"
      - "registry.json"
      - ".github/workflows/verify-extension-package.yml"
  pull_request:
    paths:
      - "sources/**"
      - "tests/**"
      - "scripts/build_packages.py"
      - "registry.json"
      - ".github/workflows/verify-extension-package.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Environment (Node & Python)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Source Manifest & Run Tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.cjs

      - name: Verify Manifest & Registry Alignment
        shell: bash
        run: |
          set -euo pipefail
          SRC_V="$(jq -r '.version' sources/spoiti-lists/manifest.json)"
          REG_V="$(jq -r '.extensions[] | select(.id == "spoiti-lists") | .version' registry.json)"

          if [[ -z "$REG_V" || "$REG_V" == "null" ]]; then
            echo "::error title=Registry Missing::registry.json does not contain a 'spoiti-lists' entry."
            exit 1
          fi

          if [[ "$SRC_V" != "$REG_V" ]]; then
            echo "::error title=Version Mismatch::sources/spoiti-lists/manifest.json ($SRC_V) does not match registry.json ($REG_V)."
            exit 1
          fi

          echo "OK: Source manifest and registry entry agree on version $SRC_V"

      - name: Build Packages & Check Git Synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_packages.py

          if ! git diff --quiet -- registry.json extensions; then
            echo "::error title=Uncommitted Build Output::Extension build changed generated files. Commit the updated registry.json and extensions archive."
            git --no-pager diff -- registry.json extensions
            exit 1
          fi

          echo "OK: Generated extension files and registry are in sync"
