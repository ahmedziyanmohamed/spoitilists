name: Build Mornye extension package

on:
  push:
    branches: [main, master]
    paths:
      - "sources/**"
      - "tests/**"
      - "scripts/**"
      - "registry.json"
      - ".github/workflows/build-extension-package.yml"
  pull_request:
    paths:
      - "sources/**"
      - "tests/**"
      - "scripts/**"
      - "registry.json"
      - ".github/workflows/build-extension-package.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_packages.py

      - name: Copy built outputs into repo folder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extension
          cp -f registry.json extension/registry.json
          find extensions -maxdepth 1 -type f -name "*.sflx" -exec cp -f {} extension/ \;

      - name: Show generated files
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated files:"
          find extension -maxdepth 2 -type f | sort

      - name: Commit generated extension folder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension
          git diff --cached --quiet || git commit -m "Build generated extension package"
          git push
